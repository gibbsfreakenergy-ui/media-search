<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Your existing <head> styles and fonts -->
</head>
<body>

    <!-- Your existing search inputs and new buttons -->
    <input type="text" id="mediaId" placeholder="TMDB or IMDb ID (e.g. 1396 or tt0944947)">
    <input type="number" id="season" placeholder="Season" value="1" style="width: 15%;">
    <input type="number" id="episode" placeholder="Episode" value="1" style="width: 15%;">

    <button onclick="streamAsset('movie')">Movie</button>
    <button onclick="streamAsset('tv')">TV Show</button>

    <div class="player-container">
        <iframe id="streamEngine" src="about:blank" frameborder="0" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>

    <!-- REPLACE YOUR OLD SCRIPT WITH THIS -->
    <script>
    function streamAsset(type) {
        const mediaId = document.getElementById('mediaId').value.trim();
        const season = document.getElementById('season').value.trim() || "1";
        const episode = document.getElementById('episode').value.trim() || "1";
        const player = document.getElementById('streamEngine');

        if (!mediaId) {
            alert("Please enter a valid ID!");
            return;
        }

        let targetStreamUrl = "";

        if (type === 'tv') {
            targetStreamUrl = `https://vidsrc.sbs/embed/tv/${encodeURIComponent(mediaId)}/${season}/${episode}`;
        } else {
            targetStreamUrl = `https://vidsrc.sbs/embed/movie/${encodeURIComponent(mediaId)}`;
        }

        player.src = targetStreamUrl;
    }
    </script>
</body>
</html>
