<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Media Finder</title>
    <!-- Google Fonts Imports -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Playfair Display', serif; 
            font-weight: 400;
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            text-align: center; 
            background: #ffffff; /* White background */
            color: #000000;      /* Black text */
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Noto Naskh Arabic', serif;
            font-weight: 700;    /* Bolded headers */
            color: #000000;
            margin-bottom: 10px;
        }

        p {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            color: #000000;
        }

        input { 
            font-family: 'Playfair Display', serif;
            padding: 10px; 
            width: 60%; 
            font-size: 16px; 
            border: 1px solid #000000; 
            border-radius: 4px; 
            background: #ffffff;
            color: #000000;
        }

        button { 
            font-family: 'Playfair Display', serif;
            padding: 10px 20px; 
            font-size: 16px; 
            background: #660000; /* Dark red highlight background */
            color: #ffffff; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
            transition: opacity 0.2s;
        }
        
        button:hover {
            opacity: 0.9;
        }

        #results { 
            margin-top: 20px; 
            text-align: left; 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #660000; /* Dark red highlight border */
        }

        .result-item { 
            margin-bottom: 15px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid #660000; /* Dark red highlight separator */
        }

        .result-item a { 
            font-family: 'Playfair Display', serif;
            color: #660000; /* Dark red highlight for links */
            text-decoration: none; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px; 
        }

        .result-item a:hover {
            text-decoration: underline;
        }

        video { 
            margin-top: 20px; 
            width: 100%; 
            max-width: 640px; 
            border-radius: 8px; 
            background: #000; 
            border: 2px solid #660000; /* Dark red highlight frame */
        }
        
        .status-message {
            color: #660000; /* Highlight color for status / error messages */
        }
    </style>
</head>
<body>

    <h1>Web Media Searcher</h1>
    <p>Search for audio or video across your configured platforms</p>

    <input type="text" id="searchQuery" placeholder="Type a song, video, or topic...">
    <button onclick="performSearch()">Search</button>

    <br>
    <video id="mediaPlayer" controls autoplay></video>

    <div id="results">Your results will show up here...</div>

    <script>
        async function performSearch() {
            const query = document.getElementById('searchQuery').value;
            const resultsDiv = document.getElementById('results');
            const player = document.getElementById('mediaPlayer');

            if (!query) return alert("Please enter a search term!");
            resultsDiv.innerHTML = "<span class='status-message'>Searching the web via Google API...</span>";

            try {
                // Calls the backend script running in the exact same repo folder (.mjs route)
                const response = await fetch(`/api/search.mjs?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<span class="status-message">Error: ${data.error}</span>`;
                    return;
                }

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = "<span class='status-message'>No matching media sources found.</span>";
                    return;
                }

                resultsDiv.innerHTML = ""; // Clear status text

                data.results.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'result-item';

                    // Create a playable link button
                    const playButton = document.createElement('button');
                    playButton.innerText = "Load into Player";
                    playButton.style.padding = "5px 10px";
                    playButton.style.fontSize = "14px";
                    playButton.onclick = () => {
                        player.src = item.url;
                        player.play();
                    };

                    itemDiv.innerHTML = `<a href="${item.url}" target="_blank">${item.title}</a>`;
                    itemDiv.appendChild(playButton);
                    resultsDiv.appendChild(itemDiv);
                });

            } catch (err) {
                console.error(err);
                resultsDiv.innerHTML = "<span class='status-message'>Failed to connect to backend server.</span>";
            }
        }
    </script>
</body>
</html>
