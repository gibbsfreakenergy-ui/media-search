<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Media Finder</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Playfair Display', serif; 
            font-weight: 400;
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            text-align: center; 
            background: #ffffff; 
            color: #000000;      
        }
        
        h1 {
            font-family: 'Noto Naskh Arabic', serif;
            font-weight: 700;    
            color: #000000;
            margin-bottom: 10px;
        }

        p {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            color: #000000;
        }

        .type-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            font-family: 'Playfair Display', serif;
            padding: 8px 24px;
            font-size: 15px;
            background: #ffffff;
            color: #660000;
            border: 2px solid #660000;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .type-btn.active {
            background: #660000;
            color: #ffffff;
        }

        .controls-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            margin-top: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .input-group label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #660000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input { 
            font-family: 'Playfair Display', serif;
            padding: 10px; 
            font-size: 16px; 
            border: 1px solid #000000; 
            border-radius: 4px; 
            background: #ffffff;
            color: #000000;
            box-sizing: border-box;
            height: 42px;
        }

        #mediaId {
            width: 280px;
        }

        .number-input {
            width: 80px;
            text-align: center;
        }

        /* Smoothly hides/reveals TV parameters */
        .tv-only {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tv-only.visible {
            display: flex;
            opacity: 1;
        }

        .submit-btn { 
            font-family: 'Playfair Display', serif;
            padding: 10px 24px; 
            font-size: 16px; 
            background: #660000; 
            color: #ffffff; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
            height: 42px;
            transition: opacity 0.2s ease;
        }
        
        .submit-btn:hover {
            opacity: 0.85;
        }

        .player-container {
            margin-top: 30px;
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid #660000; 
            background: #000;
        }

        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .tip-box {
            margin-top: 25px;
            padding: 15px;
            border: 1px dashed #660000;
            border-radius: 6px;
            text-align: left;
            font-size: 14px;
        }

        .tip-box ul {
            margin: 5px 0 0 20px;
            padding: 0;
        }
    </style>
</head>
<body>

    <h1>Web Media Searcher</h1>
    <p>Watch video streams seamlessly without accounts or log-ins</p>

    <div class="type-selector">
        <button id="movieToggle" class="type-btn active" onclick="setMediaType('movie')">Movie</button>
        <button id="tvToggle" class="type-btn" onclick="setMediaType('tv')">TV Show</button>
    </div>

    <div class="controls-container">
        <div class="input-group">
            <label for="mediaId" id="idLabel">Movie ID Code</label>
            <input type="text" id="mediaId" placeholder="TMDB or IMDb ID...">
        </div>

        <div class="input-group tv-only" id="seasonGroup">
            <label for="season">Season</label>
            <input type="number" id="season" class="number-input" placeholder="1" value="1" min="1">
        </div>

        <div class="input-group tv-only" id="episodeGroup">
            <label for="episode">Episode</label>
            <input type="number" id="episode" class="number-input" placeholder="1" value="1" min="1">
        </div>
        
        <button class="submit-btn" onclick="streamAsset()">Stream Now</button>
    </div>

    <div class="player-container">
        <iframe id="streamEngine" src="about:blank" frameborder="0" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>

    <div class="tip-box">
        <strong>💡 Direct Streaming Guide:</strong>
        <ul>
            <li><strong>Movies:</strong> Paste the ID (e.g., <code>533535</code> or <code>tt1375666</code>) and press <strong>Stream Now</strong>.</li>
            <li><strong>TV Shows:</strong> Click the <strong>TV Show</strong> toggle above to reveal the Season and Episode controls.</li>
        </ul>
    </div>

    <script>
        let currentType = 'movie';

        function setMediaType(type) {
            currentType = type;
            const movieToggle = document.getElementById('movieToggle');
            const tvToggle = document.getElementById('tvToggle');
            const seasonGroup = document.getElementById('seasonGroup');
            const episodeGroup = document.getElementById('episodeGroup');
            const idLabel = document.getElementById('idLabel');

            if (type === 'tv') {
                movieToggle.classList.remove('active');
                tvToggle.classList.add('active');
                seasonGroup.classList.add('visible');
                episodeGroup.classList.add('visible');
                idLabel.innerText = "Show ID Code";
            } else {
                tvToggle.classList.remove('active');
                movieToggle.classList.add('active');
                seasonGroup.classList.remove('visible');
                episodeGroup.classList.remove('visible');
                idLabel.innerText = "Movie ID Code";
            }
        }

        function streamAsset() {
            const mediaId = document.getElementById('mediaId').value.trim();
            const season = document.getElementById('season').value.trim() || "1";
            const episode = document.getElementById('episode').value.trim() || "1";
            const player = document.getElementById('streamEngine');

            if (!mediaId) {
                alert("Please drop a valid TMDB or IMDb ID code into the player bar!");
                return;
            }

            let targetStreamUrl = "";

            if (currentType === 'tv') {
                targetStreamUrl = `https://vidsrc.sbs/embed/tv/${encodeURIComponent(mediaId)}/${season}/${episode}`;
            } else {
                targetStreamUrl = `https://vidsrc.sbs/embed/movie/${encodeURIComponent(mediaId)}`;
            }

            player.src = targetStreamUrl;
        }
    </script>
</body>
</html>
